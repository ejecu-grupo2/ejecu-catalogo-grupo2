openapi: 3.1.0
info:
  title: Servicio de Stock
  version: dev
  description: |-
    Control de stock por producto: entradas, salidas, ajustes e historial de movimientos.
    Depende del Servicio de Productos (contracts/externos/productos.yaml): el stock se lleva por
    `producto_id`, que es el `id` de un producto activo. Stock no copia datos del producto (SKU, nombre, costo); quien los necesite los pide a Productos.
    Reglas: el historial es de solo escritura, los errores se corrigen con un ajuste y el stock nunca queda negativo.
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /api/stock/entradas:
    post:
      operationId: registrar-entrada
      summary: Registra una entrada de stock
      description: Aumenta el stock de un producto (compra, devolución, recepción). Verifica con el Servicio de Productos que el producto exista y esté activo.
      tags:
        - movimientos
      x-permiso: stock:operar
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarEntradaBody"
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema:
                type: string
                description: URL del movimiento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movimiento"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/ProductoNoEncontrado" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "500": { $ref: "#/components/responses/ErrorInterno" }
        "503": { $ref: "#/components/responses/ProductosNoDisponible" }
        default: { $ref: "#/components/responses/Error" }
  /api/stock/salidas:
    post:
      operationId: registrar-salida
      summary: Registra una salida de stock
      description: Disminuye el stock de un producto (venta, consumo, despacho). Se rechaza con 409 si la cantidad supera el stock disponible.
      tags:
        - movimientos
      x-permiso: stock:operar
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarSalidaBody"
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema:
                type: string
                description: URL del movimiento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movimiento"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/ProductoNoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "500": { $ref: "#/components/responses/ErrorInterno" }
        "503": { $ref: "#/components/responses/ProductosNoDisponible" }
        default: { $ref: "#/components/responses/Error" }
  /api/stock/ajustes:
    post:
      operationId: registrar-ajuste
      summary: Registra un ajuste de stock
      description: Corrige el stock por inventario físico, merma o error previo. La cantidad lleva signo (positiva suma, negativa resta) y el motivo es obligatorio. Se rechaza con 409 si el stock quedaría negativo.
      tags:
        - movimientos
      x-permiso: stock:administrar
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrarAjusteBody"
      responses:
        "201":
          description: Created
          headers:
            Location:
              schema:
                type: string
                description: URL del movimiento creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movimiento"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/ProductoNoEncontrado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "500": { $ref: "#/components/responses/ErrorInterno" }
        "503": { $ref: "#/components/responses/ProductosNoDisponible" }
        default: { $ref: "#/components/responses/Error" }
  /api/stock/movimientos:
    get:
      operationId: listar-movimientos
      summary: Lista el historial de movimientos
      description: Devuelve los movimientos del más reciente al más antiguo, con filtros opcionales por producto, tipo y rango de fechas. No consulta a Productos, así que también lista movimientos de productos que luego fueron desactivados.
      tags:
        - historial
      x-permiso: stock:consultar
      parameters:
        - name: producto_id
          in: query
          description: Filtra por producto (UUID del Servicio de Productos).
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          explode: false
          schema:
            type: string
            format: uuid
            description: Filtra por producto (UUID del Servicio de Productos).
            examples:
              - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        - name: tipo
          in: query
          description: Filtra por tipo de movimiento.
          example: SALIDA
          explode: false
          schema:
            $ref: "#/components/schemas/TipoMovimiento"
        - name: desde
          in: query
          description: Fecha y hora inicial, inclusive (ISO 8601).
          example: "2026-11-01T00:00:00Z"
          explode: false
          schema:
            type: string
            format: date-time
        - name: hasta
          in: query
          description: Fecha y hora final, inclusive (ISO 8601). Debe ser mayor o igual a `desde`.
          example: "2026-11-30T23:59:59Z"
          explode: false
          schema:
            type: string
            format: date-time
        - name: pagina
          in: query
          description: Número de página, desde 1.
          explode: false
          schema:
            type: integer
            format: int64
            minimum: 1
            default: 1
        - name: tamano
          in: query
          description: Movimientos por página.
          explode: false
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 100
            default: 20
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListarMovimientosBody"
        "400": { $ref: "#/components/responses/PeticionInvalida" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "500": { $ref: "#/components/responses/ErrorInterno" }
        default: { $ref: "#/components/responses/Error" }
  /api/stock/movimientos/{id}:
    get:
      operationId: obtener-movimiento
      summary: Obtiene un movimiento por su identificador
      description: Devuelve un movimiento del historial por su UUID.
      tags:
        - historial
      x-permiso: stock:consultar
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID del movimiento.
          schema:
            type: string
            format: uuid
            description: Identificador UUID del movimiento.
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movimiento"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/MovimientoNoEncontrado" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "500": { $ref: "#/components/responses/ErrorInterno" }
        default: { $ref: "#/components/responses/Error" }
  /api/stock/productos/{producto_id}:
    get:
      operationId: obtener-stock-producto
      summary: Obtiene el stock actual de un producto
      description: Devuelve el stock actual del producto. Verifica con el Servicio de Productos que exista y esté activo; si no tiene movimientos, su stock es 0.
      tags:
        - stock
      x-permiso: stock:consultar
      parameters:
        - name: producto_id
          in: path
          required: true
          description: Identificador UUID del producto en el Servicio de Productos.
          schema:
            type: string
            format: uuid
            description: Identificador UUID del producto en el Servicio de Productos.
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockProducto"
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/ProductoNoEncontrado" }
        "422": { $ref: "#/components/responses/ValidacionFallida" }
        "500": { $ref: "#/components/responses/ErrorInterno" }
        "503": { $ref: "#/components/responses/ProductosNoDisponible" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sesion
      description: JWT emitido por el servicio de identidad en cookie HttpOnly, Secure, SameSite=Lax. Confirmar el nombre de la cookie.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mismo JWT, reenviado entre servicios.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Evita duplicar el movimiento si el cliente reintenta la misma petición.
      schema:
        type: string
        maxLength: 64
    RequestId:
      name: X-Request-Id
      in: header
      description: Id de correlación. Se propaga en las llamadas al Servicio de Productos.
      schema:
        type: string
        maxLength: 64
  responses:
    Error:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    PeticionInvalida:
      description: Petición mal formada o regla de entrada incumplida (JSON inválido, `cantidad` 0 en un ajuste, `desde` posterior a `hasta`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    NoAutenticado:
      description: Falta la sesión o el token es inválido.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    SinPermiso:
      description: El usuario no tiene el permiso requerido (ver `x-permiso` del endpoint).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    ProductoNoEncontrado:
      description: El producto no existe o está desactivado en el Servicio de Productos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    MovimientoNoEncontrado:
      description: No existe un movimiento con ese identificador.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    Conflicto:
      description: Conflicto de negocio. Stock insuficiente, ajuste que dejaría el stock negativo, o `Idempotency-Key` reutilizada con otro cuerpo.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    ValidacionFallida:
      description: El cuerpo o los parámetros no cumplen el esquema (tipo, rango, formato).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    ErrorInterno:
      description: Error interno. No expone trazas ni detalles de la base de datos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
    ProductosNoDisponible:
      description: El Servicio de Productos no respondió dentro del timeout (5 s) o devolvió un error. No se registra ningún movimiento.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorModel"
  schemas:
    TipoMovimiento:
      type: string
      description: Tipo de movimiento de stock.
      enum:
        - ENTRADA
        - SALIDA
        - AJUSTE
      examples:
        - ENTRADA
    RegistrarEntradaBody:
      type: object
      additionalProperties: false
      required:
        - producto_id
        - cantidad
      properties:
        producto_id:
          type: string
          format: uuid
          description: Identificador UUID del producto (`id` en el Servicio de Productos).
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        cantidad:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          description: Unidades que ingresan, entero positivo.
          examples:
            - 10
        referencia:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9._/-]+$"
          description: Documento de origen (orden de compra, guía, etc.).
          examples:
            - OC-2026-0045
        motivo:
          type: string
          minLength: 1
          maxLength: 255
          description: Motivo libre de la entrada.
          examples:
            - Reposición mensual
    RegistrarSalidaBody:
      type: object
      additionalProperties: false
      required:
        - producto_id
        - cantidad
      properties:
        producto_id:
          type: string
          format: uuid
          description: Identificador UUID del producto (`id` en el Servicio de Productos).
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        cantidad:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
          description: Unidades que salen, entero positivo.
          examples:
            - 2
        referencia:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9._/-]+$"
          description: Documento asociado (venta, despacho, etc.).
          examples:
            - VTA-2026-0991
        motivo:
          type: string
          minLength: 1
          maxLength: 255
          description: Motivo libre de la salida.
          examples:
            - Venta en tienda
    RegistrarAjusteBody:
      type: object
      additionalProperties: false
      required:
        - producto_id
        - cantidad
        - motivo
      properties:
        producto_id:
          type: string
          format: uuid
          description: Identificador UUID del producto (`id` en el Servicio de Productos).
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        cantidad:
          type: integer
          format: int64
          minimum: -1000000
          maximum: 1000000
          not:
            const: 0
          description: Diferencia con signo. Positiva suma, negativa resta. No puede ser 0.
          examples:
            - -3
        motivo:
          type: string
          minLength: 3
          maxLength: 255
          description: Motivo del ajuste. Obligatorio.
          examples:
            - Merma detectada en inventario físico
        referencia:
          type: string
          maxLength: 100
          pattern: "^[A-Za-z0-9._/-]+$"
          description: Documento asociado (acta de inventario, etc.).
          examples:
            - INV-2026-11
    Movimiento:
      type: object
      additionalProperties: false
      required:
        - id
        - producto_id
        - tipo
        - cantidad
        - stock_resultante
        - creado_en
        - registrado_por
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Identificador único del movimiento.
          examples:
            - 9b2f6c1e-4d7a-4e53-8a10-5c3d2b7e1f64
        producto_id:
          type: string
          format: uuid
          description: Identificador UUID del producto (`id` en el Servicio de Productos).
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        tipo:
          $ref: "#/components/schemas/TipoMovimiento"
        cantidad:
          type: integer
          format: int64
          description: Positiva en ENTRADA y SALIDA, con signo en AJUSTE.
          examples:
            - 10
        stock_resultante:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Stock del producto inmediatamente después del movimiento.
          examples:
            - 18
        referencia:
          type: string
          maxLength: 100
          description: Documento asociado, si se informó.
          examples:
            - OC-2026-0045
        motivo:
          type: string
          maxLength: 255
          description: Motivo del movimiento, si se informó.
          examples:
            - Reposición mensual
        creado_en:
          type: string
          format: date-time
          readOnly: true
          description: Fecha del movimiento (timestamptz en Hito 2).
        registrado_por:
          type: string
          readOnly: true
          description: Identificador del usuario autenticado que registró el movimiento.
          examples:
            - usuario-demo
    ListarMovimientosBody:
      type: object
      additionalProperties: false
      required:
        - movimientos
        - total
        - pagina
        - tamano
      properties:
        movimientos:
          type: array
          description: Movimientos de la página, del más reciente al más antiguo.
          items:
            $ref: "#/components/schemas/Movimiento"
        total:
          type: integer
          format: int64
          description: Cantidad total de movimientos que cumplen los filtros.
          examples:
            - 2
        pagina:
          type: integer
          format: int64
          description: Página devuelta.
          examples:
            - 1
        tamano:
          type: integer
          format: int64
          description: Tamaño de página aplicado.
          examples:
            - 20
    StockProducto:
      type: object
      additionalProperties: false
      required:
        - producto_id
        - stock_actual
        - actualizado_en
      properties:
        producto_id:
          type: string
          format: uuid
          description: Identificador UUID del producto (`id` en el Servicio de Productos).
          examples:
            - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        stock_actual:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Unidades disponibles.
          examples:
            - 18
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
          description: Fecha del último movimiento (timestamptz en Hito 2).
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        location:
          type: string
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
        message:
          type: string
          description: Error message text
        value:
          description: The value at the given location
    ErrorModel:
      type: object
      additionalProperties: false
      properties:
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
        errors:
          type:
            - array
            - "null"
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
        status:
          type: integer
          format: int64
          description: HTTP status code
          examples:
            - 400
        title:
          type: string
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
        type:
          type: string
          format: uri
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
