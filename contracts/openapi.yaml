components:
  schemas:
    Categoria:
      additionalProperties: false
      properties:
        id:
          description: Identificador de la categoría (UUID)
          examples:
            - 6b7c8d9e-0f1a-4b2c-9d3e-4f5a6b7c8d9e
          format: uuid
          type: string
        nombre:
          description: Nombre visible
          examples:
            - Periféricos
          type: string
      required:
        - id
        - nombre
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Estado:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/Estado.json
          format: uri
          readOnly: true
          type: string
        estado:
          type: string
        servicio:
          type: string
      required:
        - servicio
        - estado
      type: object
    ItemCatalogo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ItemCatalogo.json
          format: uri
          readOnly: true
          type: string
        actualizado_en:
          description: Última actualización de datos
          format: date-time
          type: string
        categoria:
          deprecated: true
          description: "Obsoleto: usar categoria_ids. Nombre de la categoría; el Servicio de Productos no lo entrega"
          examples:
            - Periféricos
          type: string
        categoria_ids:
          description: Identificadores UUID de las categorías a las que pertenece
          examples:
            - - 6b7c8d9e-0f1a-4b2c-9d3e-4f5a6b7c8d9e
          items:
            type: string
          type: array
        descripcion:
          description: Detalle del producto
          examples:
            - Switches táctiles y retroiluminación
          type: string
        disponible:
          description: Indica si tiene stock para compra inmediata
          examples:
            - true
          type: boolean
        id:
          description: Identificador único del producto (UUID)
          examples:
            - 3f2c9a1e-7b4d-4c8e-9a6f-1d2e3b4c5a60
          format: uuid
          type: string
        moneda:
          description: Moneda en formato ISO 4217
          examples:
            - CLP
          type: string
        nombre:
          description: Nombre comercial
          examples:
            - Teclado Mecánico RGB
          type: string
        precio:
          description: Precio final de venta en pesos (CLP), IVA incluido
          examples:
            - 49990
          format: int64
          type: integer
        sku:
          description: Código único de referencia
          examples:
            - ELEC-001
          type: string
        stock:
          description: Unidades disponibles en inventario
          examples:
            - 15
          format: int64
          type: integer
      required:
        - id
        - sku
        - nombre
        - descripcion
        - categoria_ids
        - categoria
        - precio
        - moneda
        - stock
        - disponible
        - actualizado_en
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Mismo JWT, reenviado entre servicios.
      scheme: bearer
      type: http
    cookieAuth:
      description: JWT emitido por el servicio de identidad en cookie HttpOnly, Secure, SameSite=Lax. Confirmar el nombre de la cookie.
      in: cookie
      name: sesion
      type: apiKey
info:
  title: Catálogo
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/catalogo:
    get:
      description: Retorna los productos que se pueden vender y tienen stock, según el Servicio de Stock, con filtro opcional por categoría y paginación. El total va en el encabezado X-Total-Count.
      operationId: consultar-catalogo
      parameters:
        - description: Filtrar por categoría (UUID)
          example: 6b7c8d9e-0f1a-4b2c-9d3e-4f5a6b7c8d9e
          explode: false
          in: query
          name: categoria_id
          schema:
            description: Filtrar por categoría (UUID)
            examples:
              - 6b7c8d9e-0f1a-4b2c-9d3e-4f5a6b7c8d9e
            format: uuid
            type: string
        - deprecated: true
          description: "Obsoleto: usar categoria_id. Filtrar por nombre de categoría"
          explode: false
          in: query
          name: categoria
          schema:
            deprecated: true
            description: "Obsoleto: usar categoria_id. Filtrar por nombre de categoría"
            type: string
        - description: Número de página, desde 1
          explode: false
          in: query
          name: pagina
          schema:
            default: 1
            description: Número de página, desde 1
            format: int64
            minimum: 1
            type: integer
        - description: Productos por página
          explode: false
          in: query
          name: tamano
          schema:
            default: 20
            description: Productos por página
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ItemCatalogo"
                type:
                  - array
                  - "null"
          description: OK
          headers:
            X-Total-Count:
              schema:
                description: Cantidad total de productos vendibles que cumplen el filtro
                format: int64
                type: integer
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Listar productos vendibles
      tags:
        - Catálogo
      x-permiso: catalogo:operar
  /api/catalogo/{id}:
    get:
      description: Obtiene los detalles comerciales y el stock de un producto vendible. Responde 404 si el producto no existe, no se puede vender o no tiene stock.
      operationId: obtener-item-catalogo
      parameters:
        - description: Identificador único del producto (UUID)
          example: 3f2c9a1e-7b4d-4c8e-9a6f-1d2e3b4c5a60
          in: path
          name: id
          required: true
          schema:
            description: Identificador único del producto (UUID)
            examples:
              - 3f2c9a1e-7b4d-4c8e-9a6f-1d2e3b4c5a60
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCatalogo"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Detalle de un producto en catálogo
      tags:
        - Catálogo
      x-permiso: catalogo:operar
  /api/categorias:
    get:
      description: Retorna las categorías de productos disponibles.
      operationId: consultar-categorias
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Categoria"
                type:
                  - array
                  - "null"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Listar categorías del catálogo
      tags:
        - Catálogo
      x-permiso: catalogo:operar
  /api/estado:
    get:
      operationId: estado-catalogo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Estado de la plantilla, sin datos de negocio
