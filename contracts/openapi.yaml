components:
  schemas:
    Categoria:
      additionalProperties: false
      properties:
        id:
          description: Identificador de la categoría
          examples:
            - perifericos
          type: string
        nombre:
          description: Nombre visible
          examples:
            - Periféricos
          type: string
      required:
        - id
        - nombre
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Estado:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/Estado.json
          format: uri
          readOnly: true
          type: string
        estado:
          type: string
        servicio:
          type: string
      required:
        - servicio
        - estado
      type: object
    ItemCatalogo:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/api/schemas/ItemCatalogo.json
          format: uri
          readOnly: true
          type: string
        actualizado_en:
          description: Última actualización de datos
          format: date-time
          type: string
        categoria:
          description: Categoría a la que pertenece
          examples:
            - Periféricos
          type: string
        descripcion:
          description: Detalle del producto
          examples:
            - Switches táctiles y retroiluminación
          type: string
        disponible:
          description: Indica si tiene stock para compra inmediata
          examples:
            - true
          type: boolean
        id:
          description: Identificador único del producto
          examples:
            - prod-101
          type: string
        moneda:
          description: Moneda en formato ISO 4217
          examples:
            - CLP
          type: string
        nombre:
          description: Nombre comercial
          examples:
            - Teclado Mecánico RGB
          type: string
        precio:
          description: Precio final de venta en pesos (CLP)
          examples:
            - 49990
          format: int64
          type: integer
        sku:
          description: Código único de referencia
          examples:
            - ELEC-001
          type: string
        stock:
          description: Unidades disponibles en inventario
          examples:
            - 15
          format: int64
          type: integer
      required:
        - id
        - sku
        - nombre
        - descripcion
        - categoria
        - precio
        - moneda
        - stock
        - disponible
        - actualizado_en
      type: object
info:
  title: Catálogo
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/catalogo:
    get:
      description: Retorna los productos con stock disponible para la venta, con filtro opcional por categoría.
      operationId: consultar-catalogo
      parameters:
        - description: Filtrar por nombre de categoría
          explode: false
          in: query
          name: categoria
          schema:
            description: Filtrar por nombre de categoría
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ItemCatalogo"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Listar productos vendibles
      tags:
        - Catálogo
  /api/catalogo/{id}:
    get:
      description: Obtiene los detalles comerciales y disponibilidad de inventario de un producto específico.
      operationId: obtener-item-catalogo
      parameters:
        - description: Identificador único del producto
          example: prod-101
          in: path
          name: id
          required: true
          schema:
            description: Identificador único del producto
            examples:
              - prod-101
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCatalogo"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Detalle de un producto en catálogo
      tags:
        - Catálogo
  /api/categorias:
    get:
      description: Retorna las categorías de productos disponibles.
      operationId: consultar-categorias
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Categoria"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Listar categorías del catálogo
      tags:
        - Catálogo
  /api/estado:
    get:
      operationId: estado-catalogo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estado"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Estado de la plantilla, sin datos de negocio
